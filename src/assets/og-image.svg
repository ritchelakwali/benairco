<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c4a52"/>
      <stop offset="100%" stop-color="#1a2e33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle decorative arcs (cool-airflow suggestion) -->
  <g opacity="0.08" stroke="#fbfaf6" stroke-width="2" fill="none">
    <circle cx="1050" cy="100" r="80"/>
    <circle cx="1050" cy="100" r="140"/>
    <circle cx="1050" cy="100" r="210"/>
    <circle cx="1050" cy="100" r="290"/>
  </g>

  <!-- Accent dot -->
  <circle cx="120" cy="300" r="6" fill="#c47b3c"/>

  <!-- Eyebrow -->
  <text x="150" y="308"
    font-family="Inter, system-ui, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="3"
    fill="#c47b3c">
    AIRCO IN DE ACHTERHOEK
  </text>

  <!-- Main heading -->
  <text x="120" y="400"
    font-family="Georgia, 'Source Serif 4', serif"
    font-size="84"
    font-weight="600"
    fill="#fbfaf6">
    Benairco
  </text>

  <!-- Tagline -->
  <text x="120" y="470"
    font-family="Inter, system-ui, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#fbfaf6"
    opacity="0.85">
    Persoonlijke airco-installatie.
  </text>
  <text x="120" y="510"
    font-family="Inter, system-ui, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#fbfaf6"
    opacity="0.85">
    Persoonlijk, netjes, betaalbaar.
  </text>

  <!-- Bottom byline -->
  <text x="120" y="585"
    font-family="Inter, system-ui, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#fbfaf6"
    opacity="0.6">
    benairco.nl  ·  Ben Vriezen  ·  Gaanderen
  </text>
</svg>
